name: machigai
description: "動く間違い探し × UGC対戦型アプリ「まちがいラボ」。テンプレート動画から1箇所編集して友達に出題する新しい間違い探しゲーム。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  lottie: ^2.6.0

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0

  # Navigation
  go_router: ^14.0.0

  # Firebase
  firebase_core: ^2.28.0
  cloud_firestore: ^4.15.0
  firebase_auth: ^4.17.0
  firebase_analytics: ^10.9.0
  firebase_storage: ^11.7.0
  firebase_crashlytics: ^3.5.0
  firebase_remote_config: ^4.4.0
  cloud_functions: ^4.7.0

  # Monetization
  purchases_flutter: ^7.0.0

  # Video & Media
  video_player: ^2.8.0
  image_picker: ^1.1.0

  # Local Storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0

  # Utility
  intl: ^0.19.0
  uuid: ^4.0.0
  http: ^1.1.0
  dio: ^5.4.0
  crypto: ^3.0.0

  # petit_* dependencies (shared packages)
  petit_core:
    path: ../packages/petit_core
  petit_ui:
    path: ../packages/petit_ui
  petit_ai:
    path: ../packages/petit_ai

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/videos/

  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
